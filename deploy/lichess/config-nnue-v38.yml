token: ${LICHESS_BOT_TOKEN}
url: "https://lichess.org/"

engine:
  dir: "__ENGINE_ROOT__/build-release"
  name: "uci_nnue_v38"
  working_dir: "__ENGINE_ROOT__"
  protocol: "uci"
  ponder: false
  uci_options:
    AvoidDraw: true
    AvoidDrawMinCp: 120
    AvoidDrawMaxLossCp: 80
    MoveOverhead: 200
    LmrBase: "0.5"
    LmrDivisor: "2.45"
    LmrMinDepth: 4
    LmrMinMoveIndex: 5
    NullMoveMinDepth: 2
    NullMoveReduction: 3

  polyglot:
    enabled: false

  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false

  online_moves:
    chessdb_book:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    lichess_opening_explorer:
      enabled: false
    online_egtb:
      enabled: false

  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 2000
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 1
  sort_by: "first"
  preference: "none"
  accept_bot: true
  only_bot: false
  max_increment: 10
  min_increment: 0
  max_base: 600
  min_base: 60
  max_days: 14
  min_days: 1
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
  modes:
    - rated
  bullet_requires_increment: true
  max_simultaneous_games_per_user: 1

greeting:
  hello: "Hi, I'm running the NNUE V38 test build."
  goodbye: "Good game."
  hello_spectators: "NNUE V38 test build."
  goodbye_spectators: "Thanks for watching."

matchmaking:
  allow_matchmaking: true
  allow_during_games: false
  challenge_variant: "standard"
  challenge_timeout: 1
  challenge_initial_time:
    - 60
    - 180
    - 300
    - 600
  challenge_increment:
    - 1
    - 2
    - 3
    - 5
  opponent_rating_difference: 300
  rating_preference: "none"
  challenge_mode: "rated"
  challenge_filter: none
  include_challenge_block_list: false
