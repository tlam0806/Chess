token: ${LICHESS_BOT_TOKEN}
url: "https://lichess.org/"

engine:
  dir: "__ENGINE_ROOT__/build-release"
  name: "uci_nnue_v43"
  working_dir: "__ENGINE_ROOT__"
  protocol: "uci"
  ponder: true
  uci_options:
    MoveOverhead: 200
    TwofoldSearchDraw: true
    ReuseStaleTtScores: false
    ReuseDeeperTtScores: false
    AspirationEnabled: true
    AspirationMinDepth: 2
    AspirationDeltaBaseCp: 68
    AspirationDeltaDivisor: 33700
    AspirationExpansionPermille: 2290
    AspirationMaxFailHighReductions: 1
    AspirationMeanWeightPermille: 370
    AspirationMaxResearches: 6
    AspirationMeanClampCp: 1500
    LmrBase: "0.45"
    LmrDivisor: "2.9"
    LmrMinDepth: 3
    LmrMinMoveIndex: 6
    NullMoveMinDepth: 2
    NullMoveReduction: 4
    RfpEnabled: true
    RfpMaxDepth: 4
    RfpBaseMargin: 50
    RfpMarginPerDepth: 100
    LmpEnabled: true
    LmpMaxDepth: 3
    LmpBase: 4
    LmpDepthMultiplier: 1
    QseeEnabled: true
    QseeThreshold: -25
    MainSeeEnabled: false
    MainSeeMaxDepth: 5
    MainSeeMarginPerDepth: 100

  polyglot:
    enabled: false

  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false

  online_moves:
    chessdb_book:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    lichess_opening_explorer:
      enabled: false
    online_egtb:
      enabled: true
      source: "lichess"
      min_time: 20
      max_time: 10800
      max_pieces: 5
      move_quality: "best"

  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 2000
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 1
  sort_by: "first"
  preference: "none"
  accept_bot: true
  only_bot: false
  max_increment: 10
  min_increment: 0
  max_base: 600
  min_base: 60
  max_days: 14
  min_days: 1
  variants:
    - standard
  time_controls:
    - blitz
    - rapid
  modes:
    - rated
  bullet_requires_increment: true
  max_simultaneous_games_per_user: 1

greeting:
  hello: "Hi, I'm running the promoted NNUE V43 single-bound search."
  goodbye: "Good game."
  hello_spectators: "NNUE V43: tuned pruning, adaptive aspiration, and history-aware draws."
  goodbye_spectators: "Thanks for watching."

matchmaking:
  allow_matchmaking: true
  allow_during_games: false
  challenge_variant: "standard"
  challenge_timeout: 15
  challenge_initial_time:
    - 60
    - 180
    - 300
    - 600
  challenge_increment:
    - 1
    - 2
    - 3
    - 5
  opponent_rating_difference: 150
  rating_preference: "none"
  challenge_mode: "rated"
  challenge_filter: none
  include_challenge_block_list: false
