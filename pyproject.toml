[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-nnue"
version = "0.1.0"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["chess_nnue*"]

[tool.pytest.ini_options]
pythonpath = ["python", "."]
testpaths = ["tests/python"]
