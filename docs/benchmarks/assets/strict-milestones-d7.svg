<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Strict search architecture milestones at fixed depth 7</title>
  <desc id="desc">Horizontal bars compare pooled elapsed search time for V15, V19, V23, V25, V27, V29, V30, and V35. V35 takes 20.3 seconds compared with V15 at 270.4 seconds, a 13.30 times speedup. All selected versions returned the same fixed-depth scores.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="v35" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#background)"/>
  <circle cx="1110" cy="78" r="145" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="1040" cy="690" r="190" fill="#06b6d4" opacity="0.05"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="66" fill="#f8fafc" font-size="30" font-weight="700">Strict Search Architecture Milestones</text>
    <text x="58" y="96" fill="#94a3b8" font-size="16">Current-tree reconstruction · fixed depth 7 · 25-position corpus · elapsed time is primary</text>

    <g filter="url(#shadow)">
      <rect x="58" y="124" width="300" height="78" rx="14" fill="#18223d" stroke="#334155"/>
      <text x="82" y="158" fill="#c4b5fd" font-size="27" font-weight="700">13.30×</text>
      <text x="82" y="183" fill="#cbd5e1" font-size="15">V35 speedup over V15</text>

      <rect x="376" y="124" width="300" height="78" rx="14" fill="#18223d" stroke="#334155"/>
      <text x="400" y="158" fill="#67e8f9" font-size="27" font-weight="700">92.48%</text>
      <text x="400" y="183" fill="#cbd5e1" font-size="15">less depth-7 search time</text>

      <rect x="694" y="124" width="448" height="78" rx="14" fill="#18223d" stroke="#334155"/>
      <text x="718" y="158" fill="#86efac" font-size="27" font-weight="700">0 score mismatches</text>
      <text x="718" y="183" fill="#cbd5e1" font-size="15">9,600 timed rows across depths 6, 7, and 8</text>
    </g>

    <text x="58" y="244" fill="#e2e8f0" font-size="15" font-weight="650">Architecture checkpoint</text>
    <text x="280" y="225" fill="#e2e8f0" font-size="15" font-weight="650">Elapsed time relative to V15</text>
    <text x="280" y="244" fill="#94a3b8" font-size="13">Lower is better</text>
    <text x="910" y="244" fill="#e2e8f0" font-size="15" font-weight="650">Speedup</text>
    <text x="1022" y="244" fill="#e2e8f0" font-size="15" font-weight="650">Throughput</text>

    <g stroke="#334155" stroke-width="1">
      <line x1="280" y1="255" x2="280" y2="674"/>
      <line x1="430" y1="255" x2="430" y2="674" stroke-dasharray="4 6"/>
      <line x1="580" y1="255" x2="580" y2="674" stroke-dasharray="4 6"/>
      <line x1="730" y1="255" x2="730" y2="674" stroke-dasharray="4 6"/>
      <line x1="880" y1="255" x2="880" y2="674"/>
    </g>
    <g fill="#64748b" font-size="12" text-anchor="middle">
      <text x="280" y="690">0%</text>
      <text x="430" y="690">25%</text>
      <text x="580" y="690">50%</text>
      <text x="730" y="690">75%</text>
      <text x="880" y="690">100%</text>
    </g>

    <!-- V15: exact-depth range TT baseline -->
    <text x="58" y="290" fill="#f8fafc" font-size="16" font-weight="700">V15</text>
    <text x="99" y="290" fill="#94a3b8" font-size="11">range-TT baseline</text>
    <rect x="280" y="271" width="600" height="28" rx="7" fill="#64748b"/>
    <text x="864" y="291" fill="#ffffff" font-size="14" font-weight="650" text-anchor="end">270.4 s</text>
    <text x="910" y="291" fill="#cbd5e1" font-size="15">baseline</text>
    <text x="1022" y="291" fill="#cbd5e1" font-size="15">1.53 MNPS</text>

    <!-- V19: bucket TT and lazy legality -->
    <text x="58" y="342" fill="#f8fafc" font-size="16" font-weight="700">V19</text>
    <text x="99" y="342" fill="#94a3b8" font-size="11">bucket TT + lazy legality</text>
    <rect x="280" y="323" width="189.8" height="28" rx="7" fill="#3b82f6"/>
    <text x="457.8" y="343" fill="#ffffff" font-size="14" font-weight="650" text-anchor="end">85.5 s</text>
    <text x="910" y="343" fill="#93c5fd" font-size="15" font-weight="650">3.16×</text>
    <text x="1022" y="343" fill="#cbd5e1" font-size="15">5.59 MNPS</text>

    <!-- V23: first noisy/quiet stage split -->
    <text x="58" y="394" fill="#f8fafc" font-size="16" font-weight="700">V23</text>
    <text x="99" y="394" fill="#94a3b8" font-size="11">noisy → quiet stages</text>
    <rect x="280" y="375" width="150.4" height="28" rx="7" fill="#06b6d4"/>
    <text x="418.4" y="395" fill="#ffffff" font-size="14" font-weight="650" text-anchor="end">67.8 s</text>
    <text x="910" y="395" fill="#67e8f9" font-size="15" font-weight="650">3.99×</text>
    <text x="1022" y="395" fill="#cbd5e1" font-size="15">7.17 MNPS</text>

    <!-- V25: fixed raw move storage -->
    <text x="58" y="446" fill="#f8fafc" font-size="16" font-weight="700">V25</text>
    <text x="99" y="446" fill="#94a3b8" font-size="11">fixed raw storage</text>
    <rect x="280" y="427" width="115.5" height="28" rx="7" fill="#14b8a6"/>
    <text x="407.5" y="447" fill="#5eead4" font-size="14" font-weight="650">52.1 s</text>
    <text x="910" y="447" fill="#5eead4" font-size="15" font-weight="650">5.20×</text>
    <text x="1022" y="447" fill="#cbd5e1" font-size="15">7.72 MNPS</text>

    <!-- V27: make/unmake plus RAII -->
    <text x="58" y="498" fill="#f8fafc" font-size="16" font-weight="700">V27</text>
    <text x="99" y="498" fill="#94a3b8" font-size="11">make/unmake + RAII</text>
    <rect x="280" y="479" width="108.9" height="28" rx="7" fill="#22c55e"/>
    <text x="400.9" y="499" fill="#86efac" font-size="14" font-weight="650">49.1 s</text>
    <text x="910" y="499" fill="#86efac" font-size="15" font-weight="650">5.51×</text>
    <text x="1022" y="499" fill="#cbd5e1" font-size="15">8.19 MNPS</text>

    <!-- V29: dedicated callback generators -->
    <text x="58" y="550" fill="#f8fafc" font-size="16" font-weight="700">V29</text>
    <text x="99" y="550" fill="#94a3b8" font-size="11">four callback stages</text>
    <rect x="280" y="531" width="98.7" height="28" rx="7" fill="#6366f1"/>
    <text x="390.7" y="551" fill="#a5b4fc" font-size="14" font-weight="650">44.5 s</text>
    <text x="910" y="551" fill="#a5b4fc" font-size="15" font-weight="650">6.08×</text>
    <text x="1022" y="551" fill="#cbd5e1" font-size="15">9.80 MNPS</text>

    <!-- V30: packed hot path -->
    <text x="58" y="602" fill="#f8fafc" font-size="16" font-weight="700">V30</text>
    <text x="99" y="602" fill="#94a3b8" font-size="11">packed hot path</text>
    <rect x="280" y="583" width="46.7" height="28" rx="7" fill="#a855f7"/>
    <text x="338.7" y="603" fill="#d8b4fe" font-size="14" font-weight="650">21.1 s</text>
    <text x="910" y="603" fill="#d8b4fe" font-size="15" font-weight="650">12.83×</text>
    <text x="1022" y="603" fill="#cbd5e1" font-size="15">19.98 MNPS</text>

    <!-- V35: final range-correct Strict endpoint -->
    <text x="58" y="654" fill="#f8fafc" font-size="16" font-weight="700">V35</text>
    <text x="99" y="654" fill="#94a3b8" font-size="11">final Strict endpoint</text>
    <rect x="280" y="635" width="45.1" height="28" rx="7" fill="url(#v35)"/>
    <text x="337.1" y="655" fill="#f0abfc" font-size="14" font-weight="700">20.3 s</text>
    <text x="910" y="655" fill="#f0abfc" font-size="15" font-weight="700">13.30×</text>
    <text x="1022" y="655" fill="#f8fafc" font-size="15" font-weight="700">21.96 MNPS</text>

    <line x1="58" y1="712" x2="1142" y2="712" stroke="#334155"/>
    <text x="58" y="738" fill="#94a3b8" font-size="14">64 MiB fresh TT per tuple · Release + ThinLTO · Apple M4</text>
    <text x="1142" y="738" fill="#94a3b8" font-size="14" text-anchor="end">6 / 6 differing-move cases verified as ties</text>
  </g>
</svg>
